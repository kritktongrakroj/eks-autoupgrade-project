# Pinned EKS version
# This file sets the one Kubernetes version your cluster uses.
# The auto-upgrade job reads it. Bump it to upgrade.

cluster:
  name: eks-autoupgrade-example
  region: ap-southeast-1

# The pin. Change this to upgrade.
eks:
  version: "1.32"

# Node groups follow the same version.
nodegroups:
  - name: default
    version: "1.32"

# Add-ons pinned to versions that match 1.32.
addons:
  vpc-cni: "v1.19.2-eksbuild.1"
  coredns: "v1.11.4-eksbuild.1"
  kube-proxy: "v1.32.0-eksbuild.2"
